services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rev
      POSTGRES_PASSWORD: rev
      POSTGRES_DB: revapp
    ports:
      - "5432:5432"
    volumes:
      - rev_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rev -d revapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rev_pg:
