# Free Render web service plus the one free Postgres database allowed per workspace.
# Free Postgres expires 30 days after creation (then a 14-day upgrade window, then deletion).
# The web service and database must stay in the same region so the private connection string works.
# LLM_API_KEY is not stored here. Render asks for it in the dashboard on the first blueprint sync.

services:
  - type: web
    name: rev-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rev-postgres
          property: connectionString
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-3.8-flash
      - key: LLM_JSON_MODE
        value: object
      - key: DEV_USER_EMAIL
        value: dev@localhost
      - key: LLM_API_KEY
        sync: false

databases:
  - name: rev-postgres
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: revapp
